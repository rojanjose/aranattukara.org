# People who have represented Aranattukara in local government.
# Read by en/people/councillors.md and ml/people/councillors.md — edit here, both pages update.
#   person: slug of a page in _people (adds a link)
#   years:  leave "" when unknown; the book gives few dates
# Source unless noted: Joy Chiramel, Arranadu – Aranadu – Orunadu (2024), ch. 16.

municipality:
  - { name: { en: "Poothokkaran Rappayi", ml: "പൂത്തോക്കാരൻ റപ്പായി" }, years: "", note: { en: "The first councillor from Aranattukara, remembered as Rappayi chettan. A Burmah Shell agent at Valiyangadi, he was nominated to the council to represent the traders.", ml: "അരണാട്ടുകരയിൽ നിന്നുള്ള ആദ്യ കൗൺസിലർ — റപ്പായിച്ചേട്ടൻ. ബർമ്മാഷെൽ ഏജന്റായിരുന്ന അദ്ദേഹത്തെ കച്ചവടക്കാരുടെ പ്രതിനിധിയായി കൗൺസിലിൽ നോമിനേറ്റ് ചെയ്തു." } }
  - { name: { en: "Therattil J. Antony", ml: "തേറാട്ടിൽ ജെ. ആന്റണി" }, person: therattil-j-antony, years: "from 1962", note: { en: "Elected in 1962 and a councillor for about thirty years; chairman of the municipality for about fifteen.", ml: "1962-ൽ തിരഞ്ഞെടുക്കപ്പെട്ടു; ഏകദേശം മുപ്പതു വർഷം കൗൺസിലർ, പതിനഞ്ചോളം വർഷം ചെയർമാൻ." } }
  - { name: { en: "Thazhath J. Antony", ml: "താഴത്ത് ജെ. ആന്റണി" }, years: "from 1962", note: { en: "Elected in 1962 with Therattil J. Antony; a councillor for many years.", ml: "1962-ൽ തേറാട്ടിൽ ജെ. ആന്റണിക്കൊപ്പം തിരഞ്ഞെടുക്കപ്പെട്ടു; വർഷങ്ങളോളം കൗൺസിലർ." } }
