{%- comment -%} Search box for the business directory, shown beside the page title. {%- endcomment -%}
<div class="biz-search">
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  <input type="search" data-search=".biz-grid > .biz" data-none=".biz-none" aria-label="{% include t.html key="biz_search_placeholder" %}" placeholder="{% include t.html key="biz_search_placeholder" %}" autocomplete="off">
</div>
