{%- comment -%} Every licensed picture used on the site, from _data/credits.yml. {%- endcomment -%}
<div class="credits-list">
  {%- for c in site.data.credits %}
  {%- assign _name = c[0] %}{% assign _c = c[1] %}
  <figure id="{{ _name }}">
    {% include img.html name=_name alt="" sizes="96px" %}
    <figcaption>
      <strong>{{ _c.title }}</strong>
      {% include t.html key="credits_by" %}: {{ _c.author }}{% if _c.date != "" and _c.date != "Unknown date" %}, {{ _c.date }}{% endif %}<br>
      {% include t.html key="credits_licence" %}: {% if _c.license_url != "" %}<a href="{{ _c.license_url }}" rel="license noopener" target="_blank">{{ _c.license }}</a>{% else %}{{ _c.license }}{% endif %}{% if _c.source != "" %} · <a href="{{ _c.source }}" target="_blank" rel="noopener">{% include t.html key="credits_source" %}</a>{% endif %}
      {%- if _c.note != "" %}<br>{{ _c.note }}{% endif %}
    </figcaption>
  </figure>
  {%- endfor %}
</div>
