{%- comment -%} "Do you know more?" prompt — opens the Contribute page's form with this page filled in. {%- endcomment -%}
{%- assign _l = page.lang | default: site.default_lang -%}
<aside class="know-more">
  <p class="know-more-q">{% include t.html key="do_you_know_more" %}</p>
  <a class="btn" href="{{ '/' | append: _l | append: '/contribute/' | relative_url }}?page={{ page.url | absolute_url | url_encode }}#tell-us">{% include t.html key="tell_us" %}</a>
</aside>
